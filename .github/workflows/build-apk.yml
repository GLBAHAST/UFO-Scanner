name: Build UFO Scanner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip \
            python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev
          
      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython
          
      - name: Build APK
        run: |
          # This automatically accepts all licenses
          export JAVA_HOME=/usr/lib/jvm/temurin-11-jdk-amd64
          export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
          yes | buildozer android debug || true
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UFO-Scanner-APK
          path: bin/*.apk
